networks:
  onair_network:
    driver: bridge

services:

  icecast2:
      image: ghcr.io/onairhq/icecast2:2.5.0
      ports:
        - "8000:8000"
      environment:
        ICECAST_HOSTNAME: "localhost"
        ICECAST_LOCATION: "Earth"
        ICECAST_ADMIN_EMAIL: "admin@example.com"
        ICECAST_PORT: "8000"
        ICECAST_SOURCE_PASSWORD: "change"
        ICECAST_RELAY_PASSWORD: "change"
        ICECAST_ADMIN_USER: "admin"
        ICECAST_ADMIN_PASSWORD: "change"
        ICECAST_MAX_CLIENTS: "100"
        ICECAST_MAX_SOURCES: "2"
      networks:
        - onair_network
      ulimits:
            core:
              soft: 0
              hard: 0
      healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/status-json.xsl > /dev/null || exit 1"]
        interval: 5s
        timeout: 3s
        retries: 10
        start_period: 10s

  web_local:
    image: ghcr.io/onairhq/web:v16.4.0-rc1
    ports:
      - "3001:3000"
    environment:
      ICECAST_URL: "http://127.0.0.1:8000/local.mp3"
      ICECAST_HOST: "icecast"
      ICECAST_PORT: "8000"
      ICECAST_MOUNT: "/local.mp3"
    networks:
      - onair_network
    depends_on:
      icecast:
        condition: service_healthy

  web_s3:
    image: ghcr.io/onairhq/web:v16.4.0-rc1
    ports:
      - "3002:3000"
    environment:
      ICECAST_URL: "http://127.0.0.1:8000/s3.mp3"
      ICECAST_HOST: "icecast"
      ICECAST_PORT: "8000"
      ICECAST_MOUNT: "/s3.mp3"
    networks:
      - onair_network
    depends_on:
      icecast:
        condition: service_healthy

  liquidsoap_local:
    image: ghcr.io/onairhq/liquidsoap:v2.4.5-rc1
    volumes:
      - ./storage:/app/storage
    environment:
      ICECAST_HOST: "icecast"
      ICECAST_PORT: "8000"
      ICECAST_USER: "source"
      ICECAST_PASSWORD: "change"
      ICECAST_MOUNT: "/local.mp3"
      ICECAST_NAME: "Radio Dream Nr1"
      ICECAST_GENRE: "Rock"
      ICECAST_DESCRIPTION: "Radio Dream Local Storage"
      ICECAST_URL: "http://127.0.0.1:8000/local.mp3"
      DISCOGS_CONSUMER_KEY: ""
      DISCOGS_CONSUMER_SECRET: ""
      JINGLE_EVERY: "4"
      STREAM_BITRATE: "128"
      LOG_LEVEL: "3"
    networks:
      - onair_network
    depends_on:
      icecast:
        condition: service_healthy

  liquidsoap_s3:
    image: ghcr.io/onairhq/liquidsoap:v2.4.5-rc1
    environment:
      ICECAST_HOST: "icecast"
      ICECAST_PORT: "8000"
      ICECAST_USER: "source"
      ICECAST_PASSWORD: "change"
      ICECAST_MOUNT: "/s3.mp3"
      ICECAST_NAME: "Radio Dream Nr2"
      ICECAST_GENRE: "Rock"
      ICECAST_DESCRIPTION: "Radio Dream S3 Storage"
      ICECAST_URL: "http://127.0.0.1:8000/local.mp3"
      DISCOGS_CONSUMER_KEY: ""
      DISCOGS_CONSUMER_SECRET: ""
      JINGLE_EVERY: "4"
      STREAM_BITRATE: "128"
      LOG_LEVEL: "3"
      S3_BUCKET: ""
      S3_REGION: ""
      S3_ENDPOINT: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_PREFIX: ""
      S3_TRACKS_PREFIX: "tracks"
      S3_JINGLES_PREFIX: "jingles"
    networks:
      - onair_network
    depends_on:
      icecast:
        condition: service_healthy
